# Installs Kinetrace from scratch on clean Ubuntu, macOS and Windows machines,
# the way the launchers do, and runs the test suites that need no GPU and no
# model download. Two flavours per OS:
#   * "system python": a Python from setup-python, the venv made by the
#     launcher's own logic (run.sh / run.bat, --check mode: install + report,
#     no window);
#   * "bootstrap": the launcher is told there is no usable Python
#     (KINETRACE_BOOTSTRAP_PYTHON=1, the same branch a machine without one
#     takes) and must download its private copy into .venv/base - the path a
#     novice's computer takes. (macOS always takes the private Python now, in
#     both flavours: run.sh never builds a venv on Homebrew's Python there.)
# Runs on a push that changes how Kinetrace installs or starts (Mac install audit:
# the Mac breakages were all in these files), and by hand (Actions tab ->
# "Install check" -> Run workflow). macOS minutes count 10x on private repos.
name: Install check (Ubuntu / macOS / Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - run.sh
      - run.bat
      - Kinetrace.command
      - uninstall.sh
      - install.py
      - requirements.txt
      - kinetrace/macapp.py
      - kinetrace/paths.py
      - kinetrace/device.py
      - kinetrace/downloads.py
      - kinetrace/alltracker_backend.py
      - .github/workflows/install-check.yml

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONIOENCODING: utf-8
  # the suites' speed budgets (exports, project write / read) are set for a
  # workstation; GitHub's shared 2-4 core runners are several times slower
  KINETRACE_PERF_SCALE: "4"

jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0, pinned (I159)

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0, pinned (I159)
        with:
          python-version: "3.12"

      - name: System libraries for Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 libgl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: The launcher installs and reports (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x run.sh Kinetrace.command
          ./run.sh --check
          test -f .venv/kinetrace-install.json

      - name: The launcher installs and reports (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call run.bat --check
          if not exist .venv\kinetrace-install.json exit /b 1

      - name: A second launch is instant (already-complete path)
        if: runner.os != 'Windows'
        run: ./run.sh --check

      - name: Size of the environment (the docs quote it)
        shell: bash
        run: du -sh .venv models

      - name: Kinetrace.app and the "Kinetrace" process name (macOS)
        if: runner.os == 'macOS'
        run: |
          test -x Kinetrace.app/Contents/MacOS/Kinetrace
          plutil -p Kinetrace.app/Contents/Info.plist | grep -q '"CFBundleName" => "Kinetrace"'
          ls -la Kinetrace.app/Contents/Resources/
          test -L .venv/bin/Kinetrace
          .venv/bin/Kinetrace -c "import sys, kinetrace; assert sys.prefix.endswith('.venv'), sys.prefix; print('runs as', sys.executable)"
          bash -n uninstall.sh

      - name: AllTracker on the Apple GPU (macOS, when the runner has one)
        if: runner.os == 'macOS'
        run: |
          if .venv/bin/python -c "import sys, torch; sys.exit(0 if torch.backends.mps.is_available() else 1)"; then
            .venv/bin/python tests/verify_alltracker.py --sizes
          else
            echo "This runner has no Apple GPU (MPS): verify_alltracker.py --sizes needs a real Mac."
          fi

      - name: The app imports
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -c "import kinetrace.app, kinetrace.tracker, kinetrace.segmenter, kinetrace.bodypose, kinetrace.device; print('import OK')"
          "$PY" -m kinetrace --check
          "$PY" -m kinetrace.convert --help

      - name: Test suites without GPU or model downloads
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" tests/run_suites.py \
            verify_portable verify_core verify_projectfile verify_recovery verify_interop verify_stress verify_3d \
            verify_wand verify_lens verify_body verify_onbody_rules verify_sync verify_timeline_events \
            verify_ui_focus verify_display verify_multicam verify_3d_gui verify_sweep_fixes \
            verify_alltracker_mps verify_install_paths verify_downloads verify_update \
            verify_fingerprint verify_fingerprint_gui

      - name: Frames decode as on Windows (I266)
        # each OS's opencv-python ships its own FFmpeg: clips with B-frames behind an edit list, a late
        # start and a dropped frame must show the same picture at each frame number as on Windows
        # (tests/data/decode_identity, written there); a shift here is what a project moved to this OS
        # would show its user
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" tests/verify_decode_identity.py

      - name: Keep the logs of failing suites
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2, pinned (I159)
        with:
          name: suite-logs-${{ matrix.os }}
          path: tests/out/suite_*.log
          if-no-files-found: ignore

  bootstrap:
    # No Python on PATH at all: the launcher must fetch its own.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262      # v4.4.0, pinned (I159)

      - name: System libraries for Qt (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0 libegl1 libxkbcommon-x11-0 libgl1 \
            libxkbcommon0 libdbus-1-3 libfontconfig1

      - name: The launcher must fetch its own Python (Linux / macOS)
        if: runner.os != 'Windows'
        env:
          KINETRACE_BOOTSTRAP_PYTHON: "1"     # what a machine with no usable Python looks like
        run: |
          chmod +x run.sh
          ./run.sh --check
          test -x .venv/base/bin/python3
          .venv/bin/python -c "import sys; assert '.venv' in sys.base_prefix, sys.base_prefix; print('private python:', sys.version)"

      - name: The launcher must fetch its own Python (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          KINETRACE_BOOTSTRAP_PYTHON: "1"
        run: |
          call run.bat --check
          if not exist .venv\base\python.exe exit /b 1
          .venv\Scripts\python.exe -c "import sys; assert '.venv' in sys.base_prefix, sys.base_prefix; print('private python:', sys.version)"

      - name: The app imports with the private Python
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -c "import kinetrace.app, kinetrace.device; print('import OK')"
          "$PY" tests/run_suites.py verify_portable verify_core verify_stress

      - name: A moved / renamed folder still starts (Linux / macOS)
        # the private Python's venv links are absolute (Mac install audit P0-2): rename the
        # checkout, start again, rename it back and start again. Last step: it moves the workspace.
        if: runner.os != 'Windows'
        run: |
          here="$(basename "$GITHUB_WORKSPACE")"
          cd ..
          mv "$here" "Kinetrace moved"
          cd "Kinetrace moved"
          ./run.sh --check
          .venv/bin/python -c "import sys; assert 'Kinetrace moved' in sys.base_prefix, sys.base_prefix; print('relinked:', sys.base_prefix)"
          cd ..
          mv "Kinetrace moved" "$here"
          cd "$here"
          ./run.sh --check
