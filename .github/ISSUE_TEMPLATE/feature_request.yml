name: Feature request
description: An idea that would make Kinetrace more useful for your research.
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you need to do
      description: The task in your research, and what makes it hard with Kinetrace today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How it could work (optional; describing the need is enough).
  - type: textarea
    id: other
    attributes:
      label: Other tools
      description: Does another program do this (DeepLabCut, DLTdv, SLEAP, ...)? How?
